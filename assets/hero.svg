<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="280" viewBox="0 0 1200 280" fill="none" role="img" aria-label="lqbby - Build, Break, Ship">
  <defs>
